<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>우리의 결혼식</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="wrapper">


    <!-- 메인 -->
    <section class="hero">

        <div class="hero-image">
            <img src="images/main.jpg">
        </div>

        <div class="hero-text">
            <h1>
                우리의<br>
                특별한 날
            </h1>

            <p>
                2026.11.07 SAT
            </p>

            <p>
                신랑 조경윤 · 신부 김지원
            </p>
        </div>

    </section>



    <!-- 인사말 -->
    <section class="greeting">

        <h2>Invitation</h2>

        <p>
            소중한 분들을 모시고<br>
            새로운 시작을 함께하고자 합니다.
        </p>

    </section>



    <!-- 사진 -->
    <section class="gallery">

        <h2>Gallery</h2>

        <div class="gallery-grid">

            <img src="images/gallery1.jpg">
            <img src="images/gallery2.jpg">
            <img src="images/gallery3.jpg">

        </div>

    </section>




    <!-- 날짜 / 장소 -->
    <section class="info">

        <h2>Wedding Day</h2>

        <div class="date">
            2026.11.07<br>
            PM 12:00
        </div>


        <div class="location">

            <h3>
                웨딩홀
            </h3>

            <p>
                청주
            </p>

        </div>

    </section>



    <!-- 지도 -->
    <section class="map">

        <div>
            MAP 영역
        </div>

    </section>



    <!-- 계좌 -->
    <section class="account">

        <h2>마음 전하실 곳</h2>


        <div class="account-box">

            <p>
                신랑측
            </p>

            <p>
                국민은행 000-000-000
            </p>

        </div>


        <div class="account-box">

            <p>
                신부측
            </p>

            <p>
                국민은행 000-000-000
            </p>

        </div>


    </section>



    <!-- footer -->
    <footer>

        <p>
            함께해주셔서 감사합니다.
        </p>

    </footer>


</div>


<script src="../js/script.js"></script>

</body>
</html>
